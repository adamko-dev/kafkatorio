services:

  events-server-syslog:
    image: ${REGISTRY_HOST}/${APP_GROUP}/${APP_NAME}:${KAFKATORIO_VERSION}
    container_name: ${APP_NAME}
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile
      args:
        KAFKATORIO_VERSION: ${KAFKATORIO_VERSION}
        APP_FILES: "./build/"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: "http://kafka:29092"
      # KAFKA_STREAMS_STATE_DIR: ""
      SERVER_PORT: "8080"
      SOCKET_SERVER_PORT: "9002"
    ports:
      - "12034:9002" # syslog socket
    networks:
      - "kafka-nw"
      - "kafkatorio-nw"
      - "traefik-nw"
#    labels:
#      - "traefik.enable=true"
    secrets:
      - "kafkatorio-config.yml"

secrets:
  "kafkatorio-config.yml":
    file: ./.secret.config.yml

networks:
  kafka-nw:
    name: "kafka-nw"
    external: true
  kafkatorio-nw:
    name: "kafkatorio-nw"
    external: true
  traefik-nw:
    name: "traefik-nw"
    external: true
